[tools]
shellcheck = "latest"
pre-commit = { version = "latest", postinstall = "pre-commit install" }
bats = "latest"
uv = "latest"
ty = "latest"
ruff = "latest"
jq = "latest"
pnpm = "latest"

[env]
_.python.venv = { path = ".venv" }

[hooks]
postinstall = ["mise run sync-core", "uv sync --all-extras"]

[tasks.verify]
description = "Ensure the quality of the project"
depends = ["build --log-level FATAL"]
run = [
    { task = "typecheck" },
    { task = "format" },
    { task = "lint" },
    { task = "test" },
]

[tasks.test]
description = "Run unit, integration and mechanism tests (pytest + bats)"
depends = "build --log-level FATAL"
run = [
    { task = "test:unit" },
    { task = "test:integration" },
    { task = "test:mechanism" },
    { task = "test:unit:bats" },
    { task = "test:mechanism:bats" },
]

[tasks."test:unit"]
description = "Run unit tests (parallel via pytest-xdist)"
run = "uv run pytest -m unit -q -n auto -p no:cacheprovider"

[tasks."test:integration"]
description = "Run integration tests (parallel; skips upstream-gated tests by default)"
run = "uv run pytest -m 'integration and not upstream' -q -n auto -p no:cacheprovider"

[tasks."test:mechanism"]
description = "Run mechanism tests against source (parallel)"
run = "uv run pytest -m mechanism -q -n auto -p no:cacheprovider"

[tasks."test:unit:bats"]
description = "Run bats unit tests for install.sh"
run = "bats tests/unit/install.bats"

[tasks."test:mechanism:bats"]
description = "Run bats mechanism tests against built binary (no AI calls, parallel across tests)"
depends = "build --log-level FATAL"
run = "python3 .mise/tasks/bats_parallel.py 8 tests/e2e/mechanism.bats tests/e2e/store-and-config-passthrough.bats"

[tasks."test:e2e"]
description = "Run E2E full workflow tests"
env = { "E2E_CONFIRM" = "1" }
depends = "build --log-level FATAL"
run = "bats tests/e2e/full-workflow.bats"

[tasks.lint]
description = "Lint Python files with ruff, shellcheck on bash tasks"
run = [
    "ruff check --fix -q orchestrator/source/",
    "shellcheck -x .mise/tasks/build .mise/tasks/release .mise/tasks/sync-core .mise/tasks/version/check .mise/tasks/version/update .mise/tasks/version/lib/*.sh install.sh",
]

[tasks.format]
description = "Format Python files with ruff"
run = "ruff format -q orchestrator/source/"

[tasks."typecheck"]
description = "Type check Python files with ty"
run = "ty check orchestrator/source/"

[tasks.clean]
description = "Remove PyInstaller artifacts (build/, dist/)"
run = "rm -rf -- build dist"
