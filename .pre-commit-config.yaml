repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck -s bash --rcfile=.shellcheckrc
        language: system
        types: [shell]
        files: install.sh

      - id: check-version-bump
        name: Check version bump in versioned files
        entry: mise run version:check
        language: system
        files: ^(resources/canonical/(skills/.*/(SKILL\.md|references/.*\.md)|agents/.*\.md|commands/.*\.md)|install\.sh)$
        pass_filenames: false

      - id: check-platform-hardcodes
        name: Verify no opencode/claude hardcodes in source code
        entry: bash .opencode/scripts/check-platform-hardcodes.sh
        language: system
        files: ^orchestrator/source/(cli\.py|orchestrator/.*\.py|lib/.*\.py)$
        pass_filenames: false

      - id: check-e2e-shared-setup
        name: Verify E2E bats files chain setup_shared_e2e_dir / teardown_shared_e2e_dir
        entry: bash .opencode/scripts/check-e2e-shared-setup.sh
        language: system
        files: ^tests/e2e/.*\.bats$
        pass_filenames: false

      - id: test
        name: Verify source code and tests
        entry: mise run verify
        language: system
        files: ^(source/|tests/|pyproject\.toml|openspec\.spec)$
        pass_filenames: false
