repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck -s bash --rcfile=.shellcheckrc
        language: system
        types: [shell]
        files: install.sh

      - id: check-version-bump
        name: Check version bump in versioned files
        entry: mise run version:check
        language: system
        files: ^(resources/(opencode|claude)/(skills/.*/(SKILL\.md|references/.*\.md)|agents/.*\.md|commands/.*\.md)|install\.sh)$
        pass_filenames: false

      - id: sync-mirrors-check
        name: Verify Claude mirror is in sync with OpenCode
        entry: mise run sync-mirrors --check
        language: system
        files: ^resources/(opencode|claude)/(skills|commands)/.*\.md$
        pass_filenames: false

      - id: test
        name: Verify source code and tests
        entry: mise run verify
        language: system
        files: ^(source/|tests/|pyproject\.toml|openspec\.spec)$
        pass_filenames: false
