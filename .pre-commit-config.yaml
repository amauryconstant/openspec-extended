repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck -s bash --rcfile=.shellcheckrc
        language: system
        types: [shell]
        files: install.sh

      - id: check-version-bump
        name: Check version bump in versioned files
        entry: mise run version:check
        language: system
        files: ^(resources/opencode/(skills/.*/(SKILL\.md|references/.*\.md)|agents/.*\.md|commands/.*\.md)|install\.sh)$
        pass_filenames: false

      - id: check-platform-hardcodes
        name: Verify no opencode/claude hardcodes in source code
        entry: bash .opencode/scripts/check-platform-hardcodes.sh
        language: system
        files: ^orchestrator/source/(cli\.py|orchestrator/.*\.py|lib/.*\.py)$
        pass_filenames: false

      - id: test
        name: Verify source code and tests
        entry: mise run verify
        language: system
        files: ^(source/|tests/|pyproject\.toml|openspec\.spec)$
        pass_filenames: false
